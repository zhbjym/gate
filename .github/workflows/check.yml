name: VPN 网关节点检查

on:
  schedule:
    - cron: "* /3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 登机口检查
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 结账
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖项
        run: pip install -r requirements.txt

      - name: 获取 VPN Gate 节点 + 通过 Cloudflare Worker 检查 + 构建页面
        run: python vpngate.py
        env:
          # 已部署的检测Worker (不要配置:检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: 90

      - name: 确保已启用 GitHub Pages（一次性自动设置）
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "页面 API 状态：$code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置页面
        uses: actions/configure-pages@v5

      - name: 上传页面工件
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 显示网站 URL
        run: echo "site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (部署结果: ${{ steps.deployment.outcome }})"
